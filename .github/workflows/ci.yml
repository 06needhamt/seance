name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc-multilib mingw-w64 ffmpeg

      # mingw-w64 and FFmpeg are required: nothing may be skipped.
      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci

  sanitizers:
    name: Unit tests under ASan and UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc-multilib mingw-w64

      # The runner's high mmap randomisation can collide with ASan's shadow
      # memory; this is the usual workaround.
      - name: Reduce mmap randomisation
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure
        run: cmake --preset asan -DVFW_REQUIRE_MINGW=ON

      - name: Build
        run: cmake --build --preset asan

      - name: Test
        run: ctest --preset asan

  minimal:
    name: Build without mingw-w64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc-multilib

      # Fixture tests and the ABI check report skipped; everything else must
      # pass.
      - name: Configure
        run: cmake --preset default

      - name: Build
        run: cmake --build --preset default

      - name: Test
        run: ctest --preset default
